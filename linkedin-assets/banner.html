<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1128px;
      height: 191px;
      background: #0A0D12;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Plus Jakarta Sans", "Inter", Roboto, sans-serif;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px 0 160px; /* 160px left padding reserves space for the overlapping profile picture */
    }
    
    /* Precision grid overlay */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }
    
    /* Background glows */
    .glow-cyan {
      position: absolute;
      top: -60px;
      left: 180px;
      width: 320px;
      height: 240px;
      background: radial-gradient(circle, rgba(0, 221, 186, 0.14) 0%, transparent 70%);
      filter: blur(40px);
      pointer-events: none;
    }
    .glow-purple {
      position: absolute;
      bottom: -60px;
      right: 120px;
      width: 400px;
      height: 240px;
      background: radial-gradient(circle, rgba(112, 0, 255, 0.18) 0%, transparent 70%);
      filter: blur(50px);
      pointer-events: none;
    }

    /* Left Content Section */
    .left-col {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .top-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 221, 186, 0.1);
      border: 1px solid rgba(0, 221, 186, 0.35);
      border-radius: 9999px;
      padding: 2px 10px;
      font-size: 10px;
      font-weight: 700;
      color: #00DDBA;
      font-family: "JetBrains Mono", monospace;
      letter-spacing: 0.5px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      background: #00DDBA;
      border-radius: 50%;
      box-shadow: 0 0 8px #00DDBA;
    }
    .meta-domain {
      font-size: 12px;
      font-weight: 600;
      color: #94A3B8;
      font-family: "JetBrains Mono", monospace;
    }

    .main-title {
      font-size: 26px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: -0.8px;
      line-height: 1.15;
    }
    .main-title span.accent {
      color: #00DDBA;
    }
    .main-title span.purple {
      color: #A78BFA;
    }

    .tagline {
      font-size: 13px;
      font-weight: 500;
      color: #94A3B8;
      letter-spacing: -0.1px;
    }

    /* Right Stats & Tech Grid */
    .right-col {
      position: relative;
      z-index: 2;
      display: flex;
      gap: 12px;
    }

    .stat-card {
      background: rgba(19, 24, 33, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 135px;
      backdrop-filter: blur(8px);
    }
    .stat-val {
      font-size: 17px;
      font-weight: 800;
      color: #FFFFFF;
      font-family: "JetBrains Mono", monospace;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .stat-val .unit {
      color: #00DDBA;
      font-size: 13px;
    }
    .stat-lbl {
      font-size: 10px;
      font-weight: 600;
      color: #64748B;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .tags-container {
      display: flex;
      flex-direction: column;
      gap: 5px;
      justify-content: center;
    }
    .pill {
      font-size: 10.5px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 4px 10px;
      color: #CBD5E1;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: "JetBrains Mono", monospace;
      white-space: nowrap;
    }
    .pill-icon {
      color: #7000FF;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow-cyan"></div>
  <div class="glow-purple"></div>

  <!-- Left Column -->
  <div class="left-col">
    <div class="top-meta">
      <div class="status-badge">
        <span class="status-dot"></span>
        24/7 SLA GUARANTEED
      </div>
      <span class="meta-domain">code17.tech</span>
    </div>
    <h1 class="main-title">
      We build the <span class="purple">software</span>. We guard the <span class="accent">uptime</span>.
    </h1>
    <p class="tagline">
      24/7 Mission-Critical SRE Infrastructure & Enterprise SaaS Product Engineering
    </p>
  </div>

  <!-- Right Column -->
  <div class="right-col">
    <div class="stat-card">
      <div class="stat-val">99.99<span class="unit">%</span></div>
      <div class="stat-lbl">Uptime Target</div>
    </div>
    <div class="stat-card">
      <div class="stat-val">&lt; 15<span class="unit">min</span></div>
      <div class="stat-lbl">Incident Response</div>
    </div>
    <div class="tags-container">
      <div class="pill">
        <span class="pill-icon">◆</span> Kubernetes & GitOps
      </div>
      <div class="pill">
        <span class="pill-icon">◆</span> AWS / Azure / GCP
      </div>
      <div class="pill">
        <span class="pill-icon">◆</span> High-Concurrency SaaS
      </div>
    </div>
  </div>
</body>
</html>
