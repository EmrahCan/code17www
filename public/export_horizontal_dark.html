<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 440px;
      height: 90px;
      background: transparent;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .wrapper {
      width: 440px;
      height: 90px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 14px;
    }
    .icon-box {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #1B1F24;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-weight: 900;
      font-size: 26px;
      letter-spacing: -0.5px;
      box-shadow: 0 4px 20px rgba(0, 221, 186, 0.2);
      flex-shrink: 0;
    }
    .text-box {
      display: flex;
      flex-direction: column;
    }
    .brand-title {
      font-size: 29px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: -0.8px;
      line-height: 1;
      display: flex;
      align-items: baseline;
    }
    .brand-accent {
      color: #00DDBA;
    }
    .brand-sub {
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      color: #94A3B8;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="icon-box">17</div>
    <div class="text-box">
      <div class="brand-title">Code17<span class="brand-accent">.Tech</span></div>
      <div class="brand-sub">SaaS & SRE Engineering</div>
    </div>
  </div>
</body>
</html>
